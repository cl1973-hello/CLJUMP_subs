name: build-subscription
on:
  push:
    branches: [main]
    paths: ['my-rules.json5', 'scripts/merge.mjs']
  workflow_dispatch:
  schedule: [{ cron: '0 3 * * *' }]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i json5
      - run: node scripts/merge.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git diff --quiet --cached || git commit -m 'chore: rebuild subscription'
          git push
